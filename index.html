<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oh Mikki | Official Links</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #e11d48;
            --accent-hover: #f43f5e;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --disabled-bg: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 16px;
            border: 3px solid var(--accent-color);
            object-fit: cover;
            box-shadow: 0 4px 14px rgba(225, 29, 72, 0.3);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .bio {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 28px;
            line-height: 1.4;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 36px;
        }

        .link-card {
            background-color: var(--card-bg);
            color: var(--text-color);
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .link-card:not(.disabled):hover {
            transform: translateY(-2px);
            background-color: var(--accent-color);
            box-shadow: 0 6px 15px rgba(225, 29, 72, 0.3);
        }

        .link-card.disabled {
            background-color: var(--disabled-bg);
            color: var(--text-muted);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .link-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1rem;
        }

        .link-info i {
            font-size: 1.2rem;
            width: 24px;
        }

        .badge {
            font-size: 0.75rem;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: 500;
        }

        footer {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile Section -->
        <!-- Replace avatar.jpg with her profile picture URL or local image in repository -->
        <img src="avatar.jpg" alt="Oh Mikki" class="profile-img">
        <h1>Oh Mikki</h1>
        <p class="bio">Welcome! Check out my YouTube videos and follow along on Instagram.</p>

        <!-- Social Links -->
        <div class="links">
            <!-- YouTube -->
            <a href="https://youtube.com/@ohmikki?si=Lnu12AH5-Ux8p-h4" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="link-info">
                    <i class="fa-brands fa-youtube" style="color: #FF0000;"></i>
                    <span>YouTube</span>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 0.8rem; opacity: 0.6;"></i>
            </a>

            <!-- Instagram -->
            <a href="https://www.instagram.com/ohh.mikki?igsi=MTBra3g0YnQ4NTg1ZQ==" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="link-info">
                    <i class="fa-brands fa-instagram" style="color: #E4405F;"></i>
                    <span>Instagram</span>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 0.8rem; opacity: 0.6;"></i>
            </a>

            <!-- Facebook (Coming Soon) -->
            <div class="link-card disabled">
                <div class="link-info">
                    <i class="fa-brands fa-facebook" style="color: #1877F2;"></i>
                    <span>Facebook</span>
                </div>
                <span class="badge">Coming Soon</span>
            </div>
        </div>

        <footer>
            © ohmikki.com
        </footer>
    </div>

</body>
</html>
